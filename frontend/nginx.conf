# Скат frontend. TLS, HSTS and compression for visitors are handled by Caddy in front.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    # Behind Caddy nginx sees plain http: keep redirects (/providers → /providers/) relative.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/ld+json image/svg+xml application/manifest+json;

    # Container healthcheck; not part of the site.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts content-hashed files here: safe to cache forever.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every prerendered page must be revalidated so new deploys show up at once.
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache";
    }

    # nginx's mime.types does not know .webmanifest.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Crawler files change with each deploy; let them be re-fetched daily.
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The admin panel is one client-side app: every /admin/... URL gets its shell. Never indexed,
    # never cached (a deploy must replace it at once), never framed.
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /admin/index.html;
    }

    # Each page is its own prerendered <path>/index.html; anything else is a real 404, not a
    # copy of the home page (search engines treat those as soft 404s / duplicate content).
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
